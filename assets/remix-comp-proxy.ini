; Carmageddon 2: Carpocalypse Now — remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering
;
; Call chain:
;   BRender (software T&L) -> Glide -> nGlide -> this d3d9.dll -> d3d9_remix.dll -> .trex
;
; nGlide only ever hands Remix screen-space triangles, which Remix skips outright. The
; geometry Remix actually raytraces comes from the brender_inject module, which taps
; BrZbModelRender (0x00521890) while the vertices are still in model space and supplies
; WORLD / VIEW / PROJECTION separately via SetTransform.

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
; Carmageddon 2 has no D3D9 vertex shaders — nothing for the FFP converter to convert.
[FFP]
Enabled=0
AlbedoStage=0

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
; ============================================================
[Skinning]
Enabled=0

; ============================================================
; Optimization
;
; StaticWorld          Bakes scenery that has held one placement for three frames
;                      into per-texture chunks, with its transform baked in. The
;                      chunks are uploaded once, when the discovery burst goes
;                      quiet, and never modified afterwards, so Remix hashes them
;                      once and keeps their acceleration structures: the entire
;                      level draws in a few dozen calls with no rebuild hitches.
;                      Tracking is per actor, so instanced scenery (one lamppost
;                      model, dozens of placements) merges too. Cars, wheels,
;                      powerups and decals never merge -- they move.
;
; SuppressGameRender   Drops the game's own render of every model drawn from a
;                      live sealed chunk. BRender transforms and lights those on
;                      the CPU and nGlide rasterizes the result, all redundantly
;                      once the chunks carry them -- in dense scenes that was
;                      ~9 ms of CPU plus ~1700 pointless bridge draws per frame.
;
;                      Dynamic models (cars, peds, debris) are never suppressed:
;                      pedestrian limbs and other callback-drawn extras exist
;                      only in the game's own render stream. The HUD, menus and
;                      3D HUD widgets also render normally. Turn this OFF when
;                      running without Remix.
; ============================================================
[Optimization]
StaticWorld=1
SuppressGameRender=1

; ============================================================
; Draw distance
;
; Carmageddon 2 ships a 35 world-unit far plane (the "Yon" option, baked into
; br_camera::yon_z when the cameras are created). That is far too short for path
; tracing: scenery pops in ahead of you, and geometry leaving the frustum stops
; occluding, so light leaks in from outside the view.
;
; DisableFrustum  Keeps every frustum-rejected actor in the scene walk, so the
;                 whole level is discovered, baked and submitted from the first
;                 frames of a race. No pop-in and no light leak at any camera
;                 angle. With SuppressGameRender on, walking everything costs
;                 almost nothing -- the game no longer rasterizes what it walks.
;
; FarPlane        Far plane of the projection handed to Remix, and the game's own
;                 draw distance for whatever it still rasterizes itself. 0 keeps
;                 the game's value. For scale: track pieces sit ~60 units apart.
;
; BubbleRadius    Radius around the camera inside which geometry is kept when the
;                 frustum rejects it. Superseded by DisableFrustum; only relevant
;                 with DisableFrustum=0. 0 disables it.
; ============================================================
[Culling]
DisableFrustum=1
FarPlane=250
BubbleRadius=0

; ============================================================
; Effects
;
; DecalOffset  Distance translucent surfaces are lifted along their normals, in
;              world units. Tyre tracks, car shadows and impact smears are quads
;              laid flat on the road surface; BRender kept them out of it by
;              depth-sorting them into a bucket drawn after the road, but path
;              tracing has no draw order, so co-planar surfaces fight each other
;              and the marks sink under the tarmac. Separating them geometrically
;              is the only fix that survives ray tracing. 0 disables it.
;              For scale: track pieces sit roughly 60 units apart.
;
; SparkWidth   Width of the camera-facing quad each BRender line segment becomes,
;              as a fraction of the distance from the camera to that segment.
;              Sparks are BR_RSTYLE_EDGES models whose faces are zero-area
;              triangles, so they render nothing on real hardware; the proxy
;              rebuilds them as thin additive billboards instead. BRender drew
;              them as one-pixel screen-space lines, so the width scales with
;              distance to hold that apparent thickness -- roughly 0.001 per
;              pixel at a 60 degree vertical field of view. Raise it if the
;              streaks are too fine to see, lower it if they look like ribbons.
;
; Each fix has its own switch, so a frame rate change can be pinned on one of
; them rather than on the set. Turning one off restores exactly what the proxy
; did before that fix, including the artefact it was there to remove.
;
; TranslucentPass    Draw opaque geometry first, then everything translucent
;                    with depth writes off. Off = one pass in scene-walk order
;                    with depth writes on, and tyre tracks punch holes in the
;                    road again. Costs a second walk of the model queue.
;
; TextureTransform   Follow br_material::map_transform into the texture stage
;                    matrix so a car's rear light panel addresses one cell of
;                    its atlas. Off = all four light states show at once. This
;                    one re-reads material state for every model every frame,
;                    so it is the first thing to try if the frame rate is low.
;
; Sparks             Rebuild BR_RSTYLE_EDGES models as billboards. Off = they
;                    disappear, which is what happens without the proxy's help
;                    since their faces are zero-area triangles.
;
; VertexColour       Modulate the texture by BRender's authored vertex colour on
;                    materials flagged BR_MATF_PRELIT, which is where a sprite's
;                    tint lives. Smoke, dust and exhaust are one shared white
;                    quad recoloured per particle -- the material never changes
;                    and carries no colour of its own -- so with this off every
;                    puff in the game comes out plain white. Lit materials are
;                    untouched: BRender computes their colour at render time and
;                    Remix lights them itself.
;
; MaterialOpacity    Follow br_material::opacity, and the BRT_OPACITY_X /
;                    BRT_OPACITY_F tokens of its extra list, into the texture
;                    factor's alpha. The game fades a smoke particle by rewriting
;                    that token before every draw of it, so with this off smoke
;                    is drawn at full strength from birth to death and never
;                    thins out. Anything below full opacity also moves into the
;                    translucent pass, which is what BRender's own driver does.
; ============================================================
[Effects]
TranslucentPass=1
TextureTransform=1
Sparks=1
VertexColour=1
MaterialOpacity=1
DecalOffset=0.02
SparkWidth=0.004

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=1
DelayMs=50000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
